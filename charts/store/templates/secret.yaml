{{- if not .Values.secrets.existingSecret }}
{{- $name := include "store.secretName" . }}
{{- $existing := lookup "v1" "Secret" .Release.Namespace $name }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $name }}
  labels:
    {{- include "store.labels" . | nindent 4 }}
  annotations:
    "helm.sh/resource-policy": keep
type: Opaque
data:
  {{ .Values.secrets.keys.mariadbRootPassword }}: {{ if and $existing $existing.data (hasKey $existing.data .Values.secrets.keys.mariadbRootPassword) }}{{ index $existing.data .Values.secrets.keys.mariadbRootPassword | quote }}{{ else }}{{ default (randAlphaNum 32) .Values.secrets.mariadbRootPassword | b64enc | quote }}{{ end }}
  {{ .Values.secrets.keys.mariadbPassword }}: {{ if and $existing $existing.data (hasKey $existing.data .Values.secrets.keys.mariadbPassword) }}{{ index $existing.data .Values.secrets.keys.mariadbPassword | quote }}{{ else }}{{ default (randAlphaNum 32) .Values.secrets.mariadbPassword | b64enc | quote }}{{ end }}
  {{ .Values.secrets.keys.wordpressAdminPassword }}: {{ if and $existing $existing.data (hasKey $existing.data .Values.secrets.keys.wordpressAdminPassword) }}{{ index $existing.data .Values.secrets.keys.wordpressAdminPassword | quote }}{{ else }}{{ default (randAlphaNum 32) .Values.secrets.wordpressAdminPassword | b64enc | quote }}{{ end }}
{{- end }}