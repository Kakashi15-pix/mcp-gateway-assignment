{{- if not .Values.postgres.existingSecret }}
{{- $name := include "platform.postgresSecret" . }}
{{- $old := lookup "v1" "Secret" .Release.Namespace $name }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $name }}
  annotations:
    helm.sh/resource-policy: keep
  labels:
    {{- include "platform.labels" . | nindent 4 }}
type: Opaque
data:
  {{ .Values.postgres.secretKeys.password }}: {{ if and $old $old.data (hasKey $old.data .Values.postgres.secretKeys.password) }}{{ index $old.data .Values.postgres.secretKeys.password | quote }}{{ else }}{{ randAlphaNum 32 | b64enc | quote }}{{ end }}
{{- end }}
{{- if .Values.seed.enabled }}
{{- $name := include "platform.adminSecret" . }}
{{- $old := lookup "v1" "Secret" .Release.Namespace $name }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ $name }}
  annotations:
    helm.sh/resource-policy: keep
  labels:
    {{- include "platform.labels" . | nindent 4 }}
type: Opaque
stringData:
  ADMIN_EMAIL: {{ .Values.seed.admin.email | quote }}
  ADMIN_PASSWORD: {{ if and $old $old.data (hasKey $old.data "ADMIN_PASSWORD") }}{{ index $old.data "ADMIN_PASSWORD" | b64dec | quote }}{{ else }}{{ randAlphaNum 24 | quote }}{{ end }}
{{- end }}
